<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E3245"/>
      <stop offset="1" stop-color="#08222F"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- braço submerso (puxada), atrás da água -->
  <path d="M350 296 q 14 46 -12 68" fill="none" stroke="#1E5570" stroke-width="26" stroke-linecap="round"/>

  <!-- braço de recuperação: cotovelo alto, entrada à frente -->
  <path d="M208 306 Q 296 158 430 286" fill="none" stroke="#EAF2F4" stroke-width="30" stroke-linecap="round"/>

  <!-- cabeça com touca -->
  <circle cx="336" cy="276" r="37" fill="#0A0E12" stroke="#7FA6B6" stroke-width="7"/>

  <!-- linha d'água -->
  <path d="M56 332 q 40 -24 80 0 t 80 0 t 80 0 t 80 0 t 80 0" fill="none" stroke="#2FC6B4" stroke-width="20" stroke-linecap="round"/>
  <path d="M96 390 q 40 -24 80 0 t 80 0 t 80 0 t 80 0" fill="none" stroke="#17506B" stroke-width="20" stroke-linecap="round"/>

  <!-- respingo da pernada -->
  <g stroke="#7FA6B6" stroke-width="14" stroke-linecap="round">
    <path d="M96 296 l 14 -26"/>
    <path d="M132 290 l 10 -30"/>
  </g>
</svg>
